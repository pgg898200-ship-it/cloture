<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 400" width="550" height="400" role="img" aria-labelledby="title desc">
<title id="title">The fifth ballot locks the tally</title>
  <desc id="desc">A replay of seven JudgeBench votes in a fixed order. The first four votes are B, B, B, A. B leads 3 to 1 with three votes available, so continue. The fifth vote is B. B leads 4 to 1 with only two votes available, so stop. The last two votes are left unopened in the replay.</desc>
<rect width="550" height="400" fill="#FAFAFA"/>
<text x="22" y="35" font-size="27" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="650" text-anchor="start">The fifth ballot locks the tally</text>
<text x="22" y="64" font-size="18" font-family="'Instrument Sans', Arial, sans-serif" fill="#555C65" font-weight="400" text-anchor="start">JudgeBench replay · seven-vote panel</text>
<text x="50" y="102" font-size="18" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#555C65" font-weight="400" text-anchor="middle">1</text>
<rect x="23" y="114" width="54" height="57" fill="#FAFAFA" stroke="#555C65" stroke-width="1.8"/>
<text x="50" y="153" font-size="33" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#141619" font-weight="600" text-anchor="middle">B</text>
<text x="122" y="102" font-size="18" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#555C65" font-weight="400" text-anchor="middle">2</text>
<rect x="95" y="114" width="54" height="57" fill="#FAFAFA" stroke="#555C65" stroke-width="1.8"/>
<text x="122" y="153" font-size="33" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#141619" font-weight="600" text-anchor="middle">B</text>
<text x="194" y="102" font-size="18" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#555C65" font-weight="400" text-anchor="middle">3</text>
<rect x="167" y="114" width="54" height="57" fill="#FAFAFA" stroke="#555C65" stroke-width="1.8"/>
<text x="194" y="153" font-size="33" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#141619" font-weight="600" text-anchor="middle">B</text>
<text x="266" y="102" font-size="18" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#555C65" font-weight="400" text-anchor="middle">4</text>
<rect x="239" y="114" width="54" height="57" fill="#FAFAFA" stroke="#555C65" stroke-width="1.8"/>
<text x="266" y="153" font-size="33" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#141619" font-weight="600" text-anchor="middle">A</text>
<text x="338" y="102" font-size="18" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#555C65" font-weight="400" text-anchor="middle">5</text>
<rect x="311" y="114" width="54" height="57" fill="#315BFF" stroke="#315BFF" stroke-width="1.8"/>
<text x="338" y="153" font-size="33" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#FAFAFA" font-weight="600" text-anchor="middle">B</text>
<text x="410" y="102" font-size="18" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#555C65" font-weight="400" text-anchor="middle">6</text>
<rect x="383" y="114" width="54" height="57" fill="#FAFAFA" stroke="#555C65" stroke-width="1.8" stroke-dasharray="5 4"/>
<text x="482" y="102" font-size="18" font-family="'IBM Plex Mono', 'DejaVu Sans Mono', monospace" fill="#555C65" font-weight="400" text-anchor="middle">7</text>
<rect x="455" y="114" width="54" height="57" fill="#FAFAFA" stroke="#555C65" stroke-width="1.8" stroke-dasharray="5 4"/>
<line x1="23" y1="194" x2="528" y2="194" stroke="#DADDE1" stroke-width="1"/>
<text x="23" y="225" font-size="19" font-family="'Instrument Sans', Arial, sans-serif" fill="#555C65" font-weight="400" text-anchor="start">After four</text>
<text x="175" y="225" font-size="21" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="400" text-anchor="start">B leads 3–1. Three votes remain.</text>
<text x="175" y="254" font-size="20" font-family="'Instrument Sans', Arial, sans-serif" fill="#555C65" font-weight="650" text-anchor="start">Continue</text>
<line x1="23" y1="273" x2="528" y2="273" stroke="#DADDE1" stroke-width="1"/>
<text x="23" y="304" font-size="19" font-family="'Instrument Sans', Arial, sans-serif" fill="#555C65" font-weight="400" text-anchor="start">After five</text>
<text x="175" y="304" font-size="21" font-family="'Instrument Sans', Arial, sans-serif" fill="#141619" font-weight="400" text-anchor="start">B leads 4–1. Two votes remain.</text>
<text x="175" y="333" font-size="20" font-family="'Instrument Sans', Arial, sans-serif" fill="#315BFF" font-weight="650" text-anchor="start">Stop</text>
<text x="23" y="375" font-size="19" font-family="'Instrument Sans', Arial, sans-serif" fill="#555C65" font-weight="400" text-anchor="start">The two dashed ballots stay unopened.</text>
</svg>
