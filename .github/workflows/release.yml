name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-linux:
    name: Linux ${{ matrix.arch }} (static CLI + manylinux_2_28 wheel)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            musl_target: x86_64-unknown-linux-musl
            manylinux_image: quay.io/pypa/manylinux_2_28_x86_64
            plat_tag: manylinux_2_28_x86_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            musl_target: aarch64-unknown-linux-musl
            manylinux_image: quay.io/pypa/manylinux_2_28_aarch64
            plat_tag: manylinux_2_28_aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Determine release version tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install Rust + musl target for static CLI
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.musl_target }}

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build static CLI binary (${{ matrix.musl_target }})
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build --release -p cloture-cli --target ${{ matrix.musl_target }}
          mkdir -p release-assets stage
          cp "target/${{ matrix.musl_target }}/release/cloture" stage/cloture
          cp LICENSE NOTICE README.md include/cloture.h stage/
          tar -C stage -czf "release-assets/cloture-${{ steps.meta.outputs.tag }}-linux-${{ matrix.arch }}.tar.gz" .

      - name: Build manylinux_2_28 libcloture_core.so and universal Python wheel
        run: |
          docker run --rm -v "$PWD:/work" -w /work "${{ matrix.manylinux_image }}" bash -euo pipefail -c '
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            export PATH="$HOME/.cargo/bin:$PATH"
            RUSTFLAGS="-D warnings" cargo build --release -p cloture-core --target-dir target-manylinux
            /opt/python/cp312-cp312/bin/python3 scripts/build_wheel.py \
              --lib target-manylinux/release/libcloture_core.so \
              --plat-tag "${{ matrix.plat_tag }}" \
              --out-dir dist
            /opt/python/cp312-cp312/bin/python3 -m venv /tmp/wheel-test
            /tmp/wheel-test/bin/pip install dist/*.whl
            (cd /tmp && /tmp/wheel-test/bin/python -c "import cloture; d=cloture.AscdStopper(4, 0.05).update([0.9,0.04,0.03,0.03]); print(d)")
          '
          cp dist/*.whl release-assets/

      - uses: actions/upload-artifact@v4
        with:
          name: assets-linux-${{ matrix.arch }}
          path: release-assets/*

  build-macos:
    name: macOS (arm64 + x86_64 CLI & wheels)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Determine release version tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install Rust + macOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build macOS arm64 & x86_64 binaries and wheels
        env:
          RUSTFLAGS: "-D warnings"
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: |
          mkdir -p release-assets
          for pair in "aarch64-apple-darwin:aarch64:macosx_11_0_arm64" "x86_64-apple-darwin:x86_64:macosx_10_12_x86_64"; do
            IFS=: read -r TARGET ARCH PLAT <<< "$pair"
            cargo build --release --workspace --target "$TARGET"
            rm -rf stage && mkdir -p stage
            cp "target/${TARGET}/release/cloture" stage/cloture
            cp LICENSE NOTICE README.md include/cloture.h stage/
            tar -C stage -czf "release-assets/cloture-${{ steps.meta.outputs.tag }}-darwin-${ARCH}.tar.gz" .
            python3 scripts/build_wheel.py \
              --lib "target/${TARGET}/release/libcloture_core.dylib" \
              --plat-tag "$PLAT" \
              --out-dir release-assets
          done

      - name: Smoke-test native arm64 wheel
        run: |
          python3 -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install release-assets/*macosx_11_0_arm64.whl
          (cd /tmp && /tmp/wheel-test/bin/python -c "import cloture; print(cloture.CiteStopper(0.05).update(7))")

      - uses: actions/upload-artifact@v4
        with:
          name: assets-macos
          path: release-assets/*

  build-windows:
    name: Windows x86_64 (CLI + wheel)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine release version tag
        id: meta
        shell: bash
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Windows binary and wheel
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo build --release --workspace
          mkdir -p release-assets stage
          cp target/release/cloture.exe stage/cloture.exe
          cp LICENSE NOTICE README.md include/cloture.h stage/
          python3 -c "
          import shutil
          shutil.make_archive('release-assets/cloture-${{ steps.meta.outputs.tag }}-windows-x86_64', 'zip', 'stage')
          "
          python3 scripts/build_wheel.py \
            --lib target/release/cloture_core.dll \
            --plat-tag win_amd64 \
            --out-dir release-assets

      - name: Smoke-test Windows wheel
        shell: bash
        run: |
          python3 -m venv win-venv
          WIN_PY="$PWD/win-venv/Scripts/python.exe"
          "$WIN_PY" -m pip install release-assets/*win_amd64.whl
          (cd "$TEMP" && "$WIN_PY" -c "import cloture; print(cloture.CiteStopper(0.05).update(7))")

      - uses: actions/upload-artifact@v4
        with:
          name: assets-windows
          path: release-assets/*

  github-release:
    name: Publish GitHub Release & SHA256SUMS
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        run: |
          cd all-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload aggregated wheels for PyPI
        uses: actions/upload-artifact@v4
        with:
          name: pypi-wheels
          path: all-assets/*.whl

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: cloture ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: all-assets/*

  publish-pypi:
    name: Publish Python Wheels to PyPI (OIDC Trusted Publishing)
    needs: [github-release]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cloture
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-wheels
          path: dist

      - name: Publish wheels via OIDC Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  publish-crates:
    name: Publish Rust Crates to crates.io
    needs: [github-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Publish cloture-core and cloture-cli (when CARGO_REGISTRY_TOKEN is configured)
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN secret not set; skipping crates.io publish."
            exit 0
          fi
          cargo publish -p cloture-core
          sleep 25
          cargo publish -p cloture-cli
