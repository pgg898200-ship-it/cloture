name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-and-zero-dep-guard:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify zero external dependencies
        shell: python3 {0}
        run: |
          from pathlib import Path
          lock = Path("Cargo.lock").read_text(encoding="utf-8")
          pkgs = [line.split('"')[1] for line in lock.splitlines() if line.startswith("name = ")]
          assert sorted(pkgs) == ["cloture-cli", "cloture-core"], f"Unexpected Cargo.lock packages: {pkgs}"
          pyproj = Path("pyproject.toml").read_text(encoding="utf-8")
          assert "dependencies = []" in pyproj, "pyproject.toml must declare dependencies = []"
          print(f"Verified zero external deps: Rust packages = {pkgs}")

      - name: Build release workspace (-D warnings)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --release --workspace

      - name: Run Rust workspace tests (release)
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo test --release --workspace

      - name: Smoke-test CLI and built-in benchmark
        shell: bash
        run: |
          BIN="./target/release/cloture"
          if [ "${{ runner.os }}" = "Windows" ]; then
            BIN="./target/release/cloture.exe"
          fi
          "$BIN" --version
          "$BIN" bench

  python-wheel-and-breaker:
    name: Python Wheel & 211 Adversarial Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build release binary & shared library
        env:
          RUSTFLAGS: "-D warnings"
        run: cargo build --release --workspace

      - name: Build universal py3-none wheel
        shell: bash
        run: python3 scripts/build_wheel.py --out-dir "$RUNNER_TEMP/cloture-dist"

      - name: Install wheel into isolated venv and verify zero-dep import
        shell: bash
        run: |
          VENV="$RUNNER_TEMP/cloture-wheel-venv"
          python3 -m venv "$VENV"
          if [ "${{ runner.os }}" = "Windows" ]; then
            PY="$VENV/Scripts/python.exe"
          else
            PY="$VENV/bin/python"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install "$RUNNER_TEMP"/cloture-dist/*.whl
          # Verify import works from tempdir with zero repo paths or CLOTURE_LIB
          (cd "$(python3 -c 'import tempfile; print(tempfile.gettempdir())')" && "$PY" -c "import cloture; s=cloture.CiteStopper(0.05); print(s.update(1))")
          "$PY" -m pip install pytest numpy scipy

      - name: Run 213 Python, CLI, MCP, and adversarial breaker tests
        shell: bash
        run: |
          VENV="$RUNNER_TEMP/cloture-wheel-venv"
          if [ "${{ runner.os }}" = "Windows" ]; then
            PY="$VENV/Scripts/python.exe"
          else
            PY="$VENV/bin/python"
          fi
          "$PY" -m pytest -v tests/test_python_sdk.py tests/breaker/

      - name: Run runnable examples
        shell: bash
        run: |
          VENV="$RUNNER_TEMP/cloture-wheel-venv"
          if [ "${{ runner.os }}" = "Windows" ]; then
            PY="$VENV/Scripts/python.exe"
          else
            PY="$VENV/bin/python"
          fi
          "$PY" examples/async_consensus_demo.py
          "$PY" examples/audit_judge_panel.py
          "$PY" examples/active_ppi_eval.py

  wasm-and-js-sdk:
    name: Zero-Import WebAssembly & Node.js SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build stripped WASM and verify size <= 320 KB
        env:
          RUSTFLAGS: "-C strip=symbols -C opt-level=z"
        run: |
          cargo build --release -p cloture-core --target wasm32-unknown-unknown
          mkdir -p site/wasm
          cp target/wasm32-unknown-unknown/release/cloture_core.wasm site/wasm/cloture_core.wasm
          SIZE=$(wc -c < site/wasm/cloture_core.wasm)
          echo "WASM size: ${SIZE} bytes"
          test "$SIZE" -le 327680

      - name: Run Node.js WASM SDK test suite
        run: node --test js/test.mjs
