name: Deploy Docs & Agent Markdown Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static site + raw Markdown/JSON agent endpoints
        run: |
          rm -rf _site && mkdir -p _site/docs _site/benchmarks
          cp site/index.html _site/index.html
          cp README.md llms.txt llms-full.txt SKILL.md NOTICE LICENSE CHANGELOG.md server.json _site/
          cp docs/ARCHITECTURE.md docs/benchmarks.md docs/comparisons.md docs/integrations.md _site/docs/
          cp benchmarks/results.json _site/benchmarks/results.json
          cp include/cloture.h _site/cloture.h
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
