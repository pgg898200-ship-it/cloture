name: Deploy Docs & Interactive WASM Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build stripped zero-import WebAssembly core
        env:
          RUSTFLAGS: "-C strip=symbols -C opt-level=s"
        run: cargo build --release -p cloture-core --target wasm32-unknown-unknown

      - name: Assemble static site, interactive WASM playground, charts & raw Markdown endpoints
        run: |
          rm -rf _site && mkdir -p _site/docs/assets _site/benchmarks _site/wasm _site/js
          cp site/index.html site/playground.html _site/
          cp target/wasm32-unknown-unknown/release/cloture_core.wasm _site/wasm/cloture_core.wasm
          chmod 644 _site/wasm/cloture_core.wasm
          cp js/cloture.mjs js/cloture.d.ts _site/js/
          cp README.md llms.txt llms-full.txt SKILL.md NOTICE LICENSE CHANGELOG.md server.json _site/
          cp docs/ARCHITECTURE.md docs/benchmarks.md docs/comparisons.md docs/integrations.md _site/docs/
          cp docs/assets/*.svg _site/docs/assets/
          cp benchmarks/results.json _site/benchmarks/results.json
          cp include/cloture.h _site/cloture.h
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
